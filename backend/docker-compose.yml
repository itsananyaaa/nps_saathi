version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nps_saathi_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nps_saathi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nps_saathi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: nps_saathi_backend
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-nps_saathi}?schema=public
      JWT_SECRET: ${JWT_SECRET:-npssaathi123}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
